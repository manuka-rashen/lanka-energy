name: Verify forecasting system
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Serve the committed model through Azure startup
        run: python tests/smoke_server.py || { cat server-smoke.log; exit 1; }
      - run: python data/download_data.py
      - run: python -m energy.train
      - run: python -m pytest -q
